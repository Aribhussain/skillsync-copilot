# SkillSync Co-Pilot, Docker full mode.
#   docker compose up --build      (or: make full-up)
# App:  http://localhost:8080   API: http://localhost:8000/docs
# Credentials below are local-development defaults, not secrets. Override them in .env
# for anything beyond a laptop demo.
name: skillsync

x-backend-env: &backend-env
  APP_ENV: development
  DATABASE_URL: postgresql+pg8000://skillsync:${POSTGRES_PASSWORD:-skillsync}@postgres:5432/skillsync
  STORAGE_DIR: /app/storage
  STORAGE_BACKEND: s3
  QUEUE_BACKEND: celery
  S3_ENDPOINT: http://objectstore:8333
  S3_ACCESS_KEY: skillsync
  S3_SECRET_KEY: skillsync-dev-secret
  S3_BUCKET: evidence
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
  CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
  PUBLIC_APP_URL: http://localhost:8080
  EMBEDDINGS_ENABLED: "false"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: skillsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillsync}
      POSTGRES_DB: skillsync
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillsync -d skillsync"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object store. SeaweedFS (Apache-2.0) instead of MinIO: the MinIO
  # server is AGPL-3.0 and its images are no longer publicly pullable from Docker Hub.
  # Dev credentials live in infra/seaweedfs/s3.json (must match S3_ACCESS_KEY/S3_SECRET_KEY).
  objectstore:
    image: chrislusf/seaweedfs:4.48
    command: >-
      server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -volume.max=0 -master.volumeSizeLimitMB=1024
    volumes:
      - objdata:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: skillsync-backend:local
    environment: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - appstorage:/app/storage
      - mlmodels:/app/ml/models
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      objectstore: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    image: skillsync-backend:local
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    environment: *backend-env
    volumes:
      - appstorage:/app/storage
      - mlmodels:/app/ml/models
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build:
      context: frontend
      args:
        VITE_API_BASE: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  objdata:
  appstorage:
  mlmodels:
