name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  # The embedding re-rank needs torch (~1 GB); CI tests BM25 + lexicon, as the Docker image does.
  EMBEDDINGS_ENABLED: "false"

jobs:
  backend:
    name: Backend · ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff (format + lint, whole repo)
        working-directory: .
        run: |
          ruff format --check .
          ruff check .
      - run: python -m pytest -q

  frontend:
    name: Frontend · eslint + vue-tsc + vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx vue-tsc -b
      - run: npx vitest run
      - run: npx vite build

  e2e:
    name: E2E · Playwright (golden path, offline PWA)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend venv (the Playwright config starts uvicorn from backend/.venv)
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Frontend deps + Chromium (downloaded on the CI runner only)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright e2e (dev servers)
        working-directory: frontend
        run: npx playwright test
      - name: Playwright offline e2e (built PWA + service worker)
        working-directory: frontend
        run: npm run e2e:pwa
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/playwright-report-pwa
            frontend/test-results
          retention-days: 7

  full-mode:
    name: Docker full mode · compose + smoke
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Smoke-test deps (the script reuses backend test helpers and httpx)
        run: pip install -r backend/requirements-dev.txt
      - run: docker compose up -d --build --wait
      - run: python scripts/smoke_full.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -n 300
      - if: always()
        run: docker compose down -v
